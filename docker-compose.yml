services:
  postgres:
    image: postgres:16-alpine
    container_name: log_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logpass123}
      POSTGRES_DB: ${POSTGRES_DB:-logaggregator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loguser} -d ${POSTGRES_DB:-logaggregator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: log_platform_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://loguser:logpass123@postgres:5432/logaggregator}
      CORRELATION_WINDOW_SECONDS: ${CORRELATION_WINDOW_SECONDS:-300}
      MAX_INCIDENT_GAP_SECONDS: ${MAX_INCIDENT_GAP_SECONDS:-900}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
      # Only ./backend is bind-mounted to /app, so config.py's own
      # two-levels-up default would resolve outside the container's
      # filesystem entirely. Point it at a path we mount explicitly below,
      # so the file lands at ./logs/application.log on the host regardless
      # of whether the app runs in Docker or bare `uvicorn`.
      LOG_FILE_PATH: /var/log/log-aggregator/application.log
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./logs:/var/log/log-aggregator
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: log_platform_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  collector:
    build: ./collector
    container_name: log_platform_collector
    restart: unless-stopped
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgresql://loguser:logpass123@postgres:5432/logaggregator}
      LOG_SOURCE: ${LOG_SOURCE:-local}
      LOCAL_LOG_FILE: /var/log/log-aggregator/application.log
      POLL_INTERVAL_SECONDS: ${COLLECTOR_POLL_INTERVAL_SECONDS:-2}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      LOG_GROUP_NAME: ${LOG_GROUP_NAME:-/log-aggregator/application}
    volumes:
      - ./logs:/var/log/log-aggregator:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
