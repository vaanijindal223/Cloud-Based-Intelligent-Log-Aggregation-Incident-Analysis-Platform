services:
  postgres:
    image: postgres:16-alpine
    container_name: log_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: log_platform_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Only ./backend is bind-mounted to /app, so config.py's own
      # two-levels-up default would resolve outside the container's
      # filesystem entirely. Point it at a path we mount explicitly below,
      # so the file lands at ./logs/application.log on the host regardless
      # of whether the app runs in Docker or bare `uvicorn`.
      LOG_FILE_PATH: /var/log/log-aggregator/application.log
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./logs:/var/log/log-aggregator
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: log_platform_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
